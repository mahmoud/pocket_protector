[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "pocket-protector"
dynamic = ["version"]
description = "Handy secret management system with a convenient CLI and readable storage format."
readme = "README.md"
authors = [
    {name = "Kurt Rose", email = "kurt@kurtrose.com"},
    {name = "Mahmoud Hashemi"},
]
license = {file = "LICENSE.txt"}
requires-python = ">=3.10"
classifiers = [
    "Topic :: Security",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "attrs",
    "PyNaCl",
    "ruamel.yaml",
    "schema",
    "face>=26.0.1",
]

[project.scripts]
pprotect = "pocket_protector.__main__:main"
pocket_protector = "pocket_protector.__main__:main"

[project.urls]
Homepage = "https://github.com/mahmoud/pocket_protector"
Repository = "https://github.com/mahmoud/pocket_protector"
Documentation = "https://pocket-protector.readthedocs.io/"
Changelog = "https://github.com/mahmoud/pocket_protector/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "coverage[toml]>=7.10",  # [run] patch = subprocess/execv
    "pytest>=8",
    "tox>=4",
    "tox-uv>=1",
]

[tool.flit.sdist]
include = ["pocket_protector/tests/", "tox.ini", "LICENSE.txt", "README.md", "CHANGELOG.md", "USER_GUIDE.md"]

[tool.pytest.ini_options]
testpaths = ["pocket_protector/tests"]

[tool.coverage.run]
branch = true
source = ["pocket_protector"]
# */ prefix: patch=subprocess children run with cwd=tmp_path, where
# relative patterns no longer match.
omit = ["*/pocket_protector/tests/*", "*/pocket_protector/_vendor/*"]
# subprocess: measure `pprotect` CLI subprocesses. execv: save data before
# `exec` replaces the process; unsupported on Windows (coverage raises), so
# tox.ini sets COVERAGE_PATCH_EXECV=execv on other platforms only. The
# fallback repeats "subprocess", which coverage dedupes.
patch = ["subprocess", "${COVERAGE_PATCH_EXECV-subprocess}"]

[tool.coverage.paths]
source = [
    "pocket_protector",
    "*/site-packages/pocket_protector",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__",
]
